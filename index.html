<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모의 주식 투자 게임</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#1c232c;--line:#262d38;--text:#e6e8eb;--muted:#8b95a1;--up:#f04452;--down:#3182f6;--accent:#f5c451}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Pretendard,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:14px;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;font-weight:700}
#status{color:var(--muted);font-size:12px}
#status b{color:var(--accent);font-weight:600}
.layout{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:16px 20px;align-items:start}
.sector{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:14px;overflow:hidden}
.sector h2{font-size:14px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2);font-weight:700}
.row{display:grid;grid-template-columns:1.3fr 1fr .9fr 96px 150px;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.name{font-weight:600}
.name small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:2px}
.price{font-size:16px;font-weight:700;text-align:right}
.chg{text-align:right;font-weight:600}
.chg small{display:block;font-weight:400;font-size:11px}
.trade{display:flex;gap:4px}
.trade input{width:52px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:6px 4px;text-align:right;font-size:13px}
.trade button{border:0;border-radius:4px;padding:6px 9px;font-weight:700;color:#fff;font-size:13px}
.buy{background:var(--up)}.sell{background:var(--down)}
.trade button:hover{filter:brightness(1.15)}
.trade button:focus-visible,.trade input:focus-visible,#nick:focus-visible,#start:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
aside{position:sticky;top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
.card h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:10px}
#me-nick{font-size:18px;font-weight:700;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;padding:5px 0}
.kv span:first-child{color:var(--muted)}
.big{font-size:22px;font-weight:700}
.hold{padding:8px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px}
.hold .sub{color:var(--muted);font-size:11px}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.rank{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.rank .me{color:var(--accent);font-weight:700}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:10}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px;width:min(360px,92vw)}
#modal h2{font-size:20px;margin-bottom:6px}
#modal p{color:var(--muted);margin-bottom:16px;font-size:13px}
#nick{width:100%;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:15px;margin-bottom:12px}
#start{width:100%;padding:12px;border:0;border-radius:6px;background:var(--accent);color:#1a1400;font-weight:700;font-size:15px}
#err{color:var(--up);font-size:12px;min-height:16px;margin-bottom:6px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 18px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
.hidden{display:none!important}
@media(max-width:960px){.layout{grid-template-columns:1fr}aside{position:static;order:-1}}
@media(max-width:640px){.row{grid-template-columns:1fr 1fr;gap:8px}.spark{display:none}.trade{grid-column:1/-1}.trade input{flex:1}.layout{padding:10px}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
#bar{height:3px;background:var(--line)}#bar i{display:block;height:100%;width:0;background:var(--accent)}
#clock{color:var(--muted);font-size:12px;margin-right:12px}
#mood{font-weight:700;font-size:12px;padding:3px 9px;border-radius:10px;margin-right:10px}
#mood.bull{background:rgba(240,68,82,.18);color:var(--up)}#mood.bear{background:rgba(49,130,246,.18);color:var(--down)}
.news{font-family:'Noto Serif KR','Batang','Nanum Myeongjo',serif;background:#1a1f27;border-top:3px double #8b95a1;margin-bottom:14px}
.news .mast{text-align:center;font-size:22px;font-weight:900;letter-spacing:.3em;padding:2px 0 8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.news .mast small{display:block;font-size:11px;font-weight:400;letter-spacing:0;color:var(--muted);margin-top:2px}
.news .top h4{font-size:19px;line-height:1.4;margin-bottom:6px}
.news .top p{color:var(--muted);font-size:13px;line-height:1.6}
.news .old{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.news .old div{font-size:13px;padding:3px 0;color:#b6bcc4}
.news .old time{color:var(--muted);font-size:11px;margin-right:8px}
#bgm,#mbtn,#adm,#jbtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:3px 8px;margin-right:6px}
#vol{width:70px;margin-right:12px;accent-color:var(--accent)}
#adm,#jbtn,#bgm,#mbtn{cursor:pointer}
.trade{flex-wrap:wrap}.row{grid-template-columns:1.3fr 1fr .9fr 96px 200px}
.trade .mx,.trade .all{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:600;font-size:12px}
.lg{font-size:12px;padding:5px 0;border-top:1px solid var(--line)}.lg time{color:var(--muted);margin-right:4px}
#jmodal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:40;display:flex;align-items:center;justify-content:center}
.jbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(380px,92vw)}
.jhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px}
.jhead button{background:none;border:0;color:var(--muted);font-size:18px}
.job{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:12px;margin-bottom:8px}
.job small{display:block;color:var(--muted);margin-top:4px}.job:disabled{opacity:.45;cursor:not-allowed}
#jcool{color:var(--accent);font-size:13px;margin-top:6px}
.jt{color:var(--muted);text-align:center;margin-bottom:8px}.jc{font-size:22px;font-weight:700;text-align:center;margin:10px 0}
.jq{font-size:30px;font-weight:800;text-align:center;margin:8px 0}
.ja{width:100%;padding:12px;font-size:20px;text-align:center;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px}
.jbig{width:100%;padding:22px;font-size:20px;font-weight:800;border:0;border-radius:8px;background:var(--accent);color:#1a1400;margin-top:8px}.jbig:disabled{opacity:.5}
#shut{position:fixed;inset:0;background:rgba(14,17,22,.97);z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
#shut h2{font-size:26px;margin-bottom:10px}#shut p{color:var(--muted);margin-bottom:8px}
#shut button{margin-top:14px;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:6px}
#apanel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(320px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.6)}
#apanel h3{margin-bottom:8px}#astat{color:var(--muted);font-size:13px;margin-bottom:10px}
#apanel button{display:block;width:100%;margin-bottom:6px;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:600}
#mpanel{position:fixed;top:56px;right:16px;z-index:25;width:min(320px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
#mpanel h3{font-size:14px;margin-bottom:8px}
#mlist{max-height:240px;overflow:auto;margin-bottom:10px}
#mlist .it{display:flex;align-items:center;gap:4px}
#mlist .pick{flex:1;text-align:left;background:none;border:0;color:var(--text);padding:8px;border-radius:4px;font-size:13px}
#mlist .it.on .pick{color:var(--accent);font-weight:700;background:var(--panel2)}
#mlist .del{background:none;border:0;color:var(--muted);padding:6px}
.madd{display:flex;gap:6px;margin-bottom:8px}
.madd input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:7px;font-size:13px}
.madd button{background:var(--accent);color:#1a1400;border:0;border-radius:4px;padding:7px 12px;font-weight:700}
.mrep{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
#mmsg{color:var(--up);font-size:12px;margin-top:6px;min-height:14px}
#ytbox{position:fixed;left:12px;bottom:12px;z-index:15;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#000}
#alert{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:30;padding:14px 26px;border-radius:8px;font-size:18px;font-weight:800;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:92vw;text-align:center}
#alert.bull{background:#c62a37}#alert.bear{background:#1f5fc9}
</style>
</head>
<body>

<!-- 닉네임 입력 모달 -->
<div id="modal">
  <div class="box">
    <h2>모의 주식 투자</h2>
    <p>친구들과 같은 시장에서 투자합니다. 시작 자본금 <span id="m-cash"></span>원</p>
    <input id="nick" maxlength="12" placeholder="닉네임 (최대 12자)" autocomplete="off">
    <div id="err"></div>
    <button id="start">게임 시작</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>📈 모의 주식 투자</h1>
    <div style="display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end"><button id="jbtn" title="알바">💼 알바</button><button id="adm" title="관리자">⚙</button><button id="mbtn" title="음악 선택">🎵</button><button id="bgm" title="배경음악 켜기/끄기">🔊</button><input id="vol" type="range" min="0" max="100" value="35" aria-label="볼륨"><span id="mood" class="hidden"></span><span id="clock"></span><span id="status">연결 중…</span></div>
  </header>
  <div id="bar"><i></i></div>
  <div class="layout">
    <main><section class="card news"><div class="mast">주식일보<small id="ndate"></small></div><div id="news"><div class="empty">아직 들어온 소식이 없습니다. 속보를 기다려 주세요.</div></div></section><div id="list"></div></main>
    <aside>
      <div class="card">
        <h3>내 정보</h3>
        <div id="me-nick"></div>
        <div class="kv"><span>보유 현금</span><span id="me-cash"></span></div>
        <div class="kv"><span>총 평가 자산</span><span id="me-equity" class="big"></span></div>
        <div class="kv"><span>총 수익률</span><span id="me-ret"></span></div>
        <div class="kv"><span>총 평가손익</span><span id="me-pl"></span></div>
      </div>
      <div class="card"><h3>보유 주식</h3><div id="holds"></div></div>
      <div class="card"><h3>거래 내역</h3><div id="logs"></div></div>
      <div class="card"><h3>자산 랭킹 TOP 5 · v10</h3><div id="ranks"></div></div>
    </aside>
  </div>
</div>
<div id="alert" class="hidden"></div>
<div id="jmodal" class="hidden"><div class="jbox">
  <div class="jhead"><b>💼 알바</b><button id="jclose" aria-label="닫기">✕</button></div>
  <div id="jmenu">
    <button class="job" data-j="box"><b>📦 택배 상하차</b><small>10초 동안 최대한 많이 클릭! 클릭당 50원 (최대 5,000원)</small></button>
    <button class="job" data-j="calc"><b>🧮 편의점 계산</b><small>20초 동안 암산 문제! 정답당 2,000원</small></button>
    <div id="jcool"></div>
  </div>
  <div id="jgame" class="hidden"></div>
</div></div>
<div id="shut" class="hidden"><div><h2>🛠 점검 중</h2><p id="shutmsg"></p><p class="sub">점검이 끝나면 자동으로 다시 열려요.</p><button id="adm2">⚙ 관리자</button></div></div>
<div id="apanel" class="hidden">
  <h3>⚙ 관리자</h3><div id="astat"></div>
  <button id="a-on">🔴 셧다운 시작</button><button id="a-off">🟢 셧다운 해제</button>
  <button id="a-reset">♻ 전체 초기화 (새 시즌)</button><button id="a-close">닫기</button>
</div>
<div id="mpanel" class="hidden">
  <h3>🎵 음악 선택</h3>
  <div id="mlist"></div>
  <div class="madd"><input id="murl" placeholder="유튜브 주소 붙여넣기" aria-label="유튜브 주소"><button id="madd">추가</button></div>
  <label class="mrep"><input type="checkbox" id="mrep"> 한 곡 반복 (끄면 목록 순서대로)</label>
  <div id="mmsg"></div>
</div>
<div id="ytbox" class="hidden"><div id="ytplayer"></div></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
/* =========================================================
   ★ 설정값 (여기만 수정하면 됩니다)
   ========================================================= */
const INITIAL_PRICE = 10000;   // 모든 종목 시작 주가
const MIN_PRICE     = 100;     // 최소 주가 하한선
const MAX_MOVE      = 0.02;    // 한 번에 기본 변동폭 ±2%
const TICK_MS       = 10000;   // 주가 변동 주기 (10초)  ← 더 느리게: 숫자를 키우세요
const START_CASH    = 1000000; // 초기 자본금
const HISTORY_LEN   = 90;      // 차트용 최근 가격 개수
const ADMIN_PASSWORD = '4927';  // ★ 관리자 비밀번호 (꼭 바꾸세요!)
const JOB_COOLDOWN_MS = 60000;  // 알바 쿨타임 (모든 알바 공통) 60초
const JOB_BOX_PAY = 50, JOB_BOX_MAX = 100, JOB_BOX_SEC = 10;  // 택배: 클릭당 50원, 최대 100번, 10초
const JOB_CALC_PAY = 2000, JOB_CALC_SEC = 20;                 // 계산: 정답당 2,000원, 20초
/* ★ 기본 음악 목록: 접속자는 🎵 버튼에서 이 중에서 고르거나, 유튜브 주소를 직접 추가할 수 있습니다 (t=제목, u=유튜브 주소) */
const MUSIC_LIST = [
  {t:'기본 음악', u:'https://youtu.be/CbS7WwlcU8U'}
];
/* 이벤트(뉴스) 설정 */
const EVENT_MIN_MS  = 1*60*1000;   // 이벤트 최소 간격 1분
const EVENT_MAX_MS  = 3*60*1000;   // 이벤트 최대 간격 3분
const EVENT_TICKS   = 12;          // 이벤트 영향이 지속되는 변동 횟수 (12회 × 10초 = 2분)
const STOCK_DRIFT   = 0.008;       // 종목 이벤트: 변동 때마다 ±0.8% 추가
const GROUP_DRIFT   = 0.005;       // 그룹 이벤트: ±0.5%
const MARKET_DRIFT  = 0.006;       // 불장/하락장: ±0.6%

const firebaseConfig = {
  apiKey: "AIzaSyAcC1R3F9xSoPIB0MeoSCxODFNtsUFTptc",
  authDomain: "jusick-62ae2.firebaseapp.com",
  databaseURL: "https://jusick-62ae2-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "jusick-62ae2",
  storageBucket: "jusick-62ae2.firebasestorage.app",
  messagingSenderId: "717684758310",
  appId: "1:717684758310:web:37e6fc87a20ff6cd7653e7",
  measurementId: "G-2TPT5PNZZH"
};
/* ========================================================= */

const SECTORS = [
  {name:'민준 그룹',  stocks:['민준공업','민준제과','민준배달','민준이사']},
  {name:'수현K 그룹', stocks:['수현k과자','수현k유통','수현k자동차','수현k부동산']},
  {name:'수현J 그룹', stocks:['수현j휴대폰','수현j컴퓨터','수현j게임','수현j피규어']},
  {name:'지후 그룹',  stocks:['지후비행사','지후관제탑','지후SSD','지후그래픽카드']}
];
const ALL = [];
SECTORS.forEach((s,si)=>s.stocks.forEach((n,i)=>ALL.push({id:'s'+(si*4+i),name:n,sector:s.name,gi:si})));
const BYID = Object.fromEntries(ALL.map(s=>[s.id,s]));

/* ---------- 신문 기사 (종목별 [호재, 악재]) ---------- */
const STORY = {
  s0:['민준공업, 대형 설비 수주 \'잭팟\'…공장 풀가동','민준공업 공장서 가동 중단 사고…생산 차질 우려'],
  s1:['민준제과 신제품 SNS서 품절 대란…"없어서 못 판다"','민준제과 제품서 이물질 논란…소비자 불만 확산'],
  s2:['민준배달, 라이더 증원에 주문 폭주…역대 최대 실적','민준배달 앱 먹통 사태…주문 대량 취소'],
  s3:['민준이사, 개학철 이사 성수기에 예약 꽉 찼다','민준이사 작업 중 가구 파손 논란…보상 갈등'],
  s4:['수현k과자, 해외 수출길 열렸다…현지 마트 입점','수현k과자 원재료값 급등…가격 인상 불가피'],
  s5:['수현k유통, 물류 자동화 성공…배송 속도 2배','수현k유통 물류센터 파업…배송 지연 속출'],

const LB = ['투자자들 사이에서 불안감이 번지며 매도 물량이 나오고 있다.','증권가에서는 단기 실적 악화가 불가피하다는 분석이 나온다.','업계 관계자들은 당분간 약세 흐름이 이어질 수 있다고 우려했다.'];
const pick = a => a[Math.floor(Math.random()*a.length)];
const rndGap = () => Math.round(EVENT_MIN_MS + Math.random()*(EVENT_MAX_MS-EVENT_MIN_MS));

function genEvent(now){
  const r = Math.random(), good = Math.random()<0.5, sg = good?1:-1;
  let kind, ids, head, d, lede;
  if(r<0.5){
    const s = pick(ALL); kind='stock'; ids=[s.id]; head=STORY[s.id][good?0:1]; d=STOCK_DRIFT*sg;
  }else if(r<0.8){
    const gi = Math.floor(Math.random()*4); kind='group';
    ids = ALL.filter(s=>s.gi===gi).map(s=>s.id); head=GROUPS[gi][good?0:1]; d=GROUP_DRIFT*sg;
  }else{
    kind = good?'bull':'bear'; ids = ALL.map(s=>s.id); d=MARKET_DRIFT*sg;
    head = good ? '🐂 불장 개막! 투자 열기 폭발…전 종목 훈풍' : '🐻 하락장 돌입! 공포 확산…전 종목 동반 약세';
    lede = good ? '시장 전반에 매수세가 몰리며 모든 종목이 들썩이고 있다.' : '시장 전반에 매도세가 번지며 모든 종목이 흔들리고 있다.';
  }
  return {
    news:{id:now,t:now,kind,good,head,lede:lede||pick(good?LG:LB)},
    act:{ids,d,n:EVENT_TICKS,m:(kind==='bull'||kind==='bear')?kind:''}
  };
}

/* ---------- 시장 데이터: 모든 접속자가 /market 하나를 공유 ---------- */
function initMarket(now){
  const stocks = {};
  ALL.forEach(s=>stocks[s.id]={p:INITIAL_PRICE,prev:INITIAL_PRICE,h:[INITIAL_PRICE]});
  return {last:now,tick:0,stocks,news:[],active:[],nextEvent:now+rndGap()};
}
/* 아무 접속자나 시도하되, 트랜잭션 덕분에 주기당 단 1명만 성공 → 모두 같은 값 */
function tryTick(){
  if(shut) return;
  const now = Date.now()+offset;
  db.ref('market').transaction(cur=>{
    if(!cur) return initMarket(now);
    if(now-cur.last < TICK_MS-300) return;
    const act = cur.active||[], drift = {};
    act.forEach(a=>a.ids.forEach(id=>drift[id]=(drift[id]||0)+a.d));
    const next = {
      last:now, tick:(cur.tick||0)+1, stocks:{}, news:cur.news||[],
      nextEvent:cur.nextEvent?Math.min(cur.nextEvent,now+EVENT_MAX_MS):now+rndGap(),
      active:act.map(a=>({ids:a.ids,d:a.d,n:a.n-1,m:a.m||''})).filter(a=>a.n>0)
    };
    ALL.forEach(s=>{
      const c = (cur.stocks&&cur.stocks[s.id])||{p:INITIAL_PRICE,h:[INITIAL_PRICE]};
      const r = (Math.random()*2-1)*MAX_MOVE + (drift[s.id]||0);
      const p = Math.max(MIN_PRICE, Math.round(c.p*(1+r)));
      next.stocks[s.id] = {p, prev:c.p, h:(c.h||[]).concat(p).slice(-HISTORY_LEN)};
    });
    if(now>=next.nextEvent){            // 이벤트 발생 시각이 되면 신문 기사 생성
      const e = genEvent(now);
      next.news = [e.news].concat(next.news).slice(0,10);
      next.active.push(e.act);
      next.nextEvent = now+rndGap();
    }
    return next;
  },null,false);
}

function spark(h,c){
  if(!h||h.length<2) return `<line x1="0" y1="15" x2="96" y2="15" stroke="#8b95a1" stroke-width="1.5"/>`;
  const mn=Math.min(...h), mx=Math.max(...h), rg=(mx-mn)||1;
  const pts = h.map((v,i)=>`${(i/(h.length-1)*94+1).toFixed(1)},${(27-((v-mn)/rg)*24).toFixed(1)}`).join(' ');
  const col = c>0?'#f04452':c<0?'#3182f6':'#8b95a1';
  return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/>`;
}

function update(){
  if(!market||!market.stocks) return;
  let stockValue=0;
  ALL.forEach(s=>{
    const d = market.stocks[s.id]; if(!d) return;
    const diff = d.p-d.prev, rate = d.prev? diff/d.prev*100 : 0;
    const row = $('r-'+s.id); if(!row) return;
    const pe = row.querySelector('[data-f=price]');
    pe.textContent = won(d.p); pe.className = 'price '+cls(diff);
    const ce = row.querySelector('[data-f=chg]');
    ce.className = 'chg '+cls(diff);
    ce.innerHTML = `${arrow(diff)} ${pct(rate)}<small>${diff>0?'+':''}${won(diff)}</small>`;
    row.querySelector('[data-f=spark]').innerHTML = spark(d.h,diff);
    const own = me.hold[s.id];
    row.querySelector('.h').textContent = own? `보유 ${won(own.qty)}주` : '';
  });
  const hl = $('holds'); hl.innerHTML='';
  Object.keys(me.hold).forEach(id=>{
    const h = me.hold[id], d = market.stocks[id]; if(!h||h.qty<=0||!d) return;
    const p = (d.p-h.avg)*h.qty, r = (d.p-h.avg)/h.avg*100;
    stockValue += d.p*h.qty;
    const el = document.createElement('div'); el.className='hold';
    el.innerHTML = `<b></b><span class="${cls(p)}" style="text-align:right">${p>0?'+':''}${won(p)}원</span>
      <span class="sub">${won(h.qty)}주 · 평균 ${won(h.avg)}원</span><span class="sub ${cls(p)}" style="text-align:right">${pct(r)}</span>`;
    el.querySelector('b').textContent = BYID[id].name;
    hl.appendChild(el);
  });
  if(!hl.children.length) hl.innerHTML = '<div class="empty">보유 중인 주식이 없습니다.</div>';
  const equity = me.cash+stockValue, ret = (equity-START_CASH)/START_CASH*100, tpl = equity-START_CASH;
  $('me-cash').textContent = won(me.cash)+'원';
  $('me-equity').textContent = won(equity)+'원';
  $('me-ret').textContent = pct(ret); $('me-ret').className = cls(ret);
  $('me-pl').textContent = (tpl>0?'+':'')+won(tpl)+'원'; $('me-pl').className = cls(tpl);
  const now = Date.now();

    lastPush = now;
    db.ref('players/'+myKey).set({nick:me.nick,equity:Math.round(equity)}).catch(e=>{console.error(e);$('ranks').textContent='랭킹 저장 실패: '+(e.code||e.message)+' → Firebase 규칙을 확인하세요';});
  }
}

/* ---------- 매수 / 매도 ---------- */
function trade(id,type,qty){
  if(!market||!market.stocks[id]) return toast('시세를 불러오는 중입니다.');
  if(!Number.isInteger(qty)||qty<=0) return toast('수량은 1 이상의 정수여야 합니다.');
  const price = market.stocks[id].p, name = BYID[id].name;
  if(type==='buy'){
    const cost = price*qty;
    if(cost>me.cash) return toast('보유 현금이 부족합니다.');
    const h = me.hold[id]||{qty:0,avg:0};
    h.avg = (h.avg*h.qty+cost)/(h.qty+qty); h.qty += qty;
    me.hold[id]=h; me.cash-=cost;
    toast(`${name} ${won(qty)}주 매수 (${won(price)}원)`); addLog('매수',name,qty,price);
  }else{
    const h = me.hold[id];
    if(!h||h.qty<qty) return toast('보유 수량이 부족합니다.');
    h.qty-=qty; me.cash+=price*qty;
    if(h.qty===0) delete me.hold[id];
    toast(`${name} ${won(qty)}주 매도 (${won(price)}원)`); addLog('매도',name,qty,price);
  }
  localStorage.setItem(pk(),JSON.stringify(me));
  lastPush=0; update();
}

  if(pw!==ADMIN_PASSWORD) return toast('비밀번호가 달라요.');
  $('apanel').classList.remove('hidden');
}
$('adm').onclick=adminOpen; $('adm2').onclick=adminOpen;
$('a-close').onclick=()=>$('apanel').classList.add('hidden');
$('a-on').onclick=()=>{ const m=prompt('접속자에게 보여줄 안내 문구',' 업데이트 중입니다. 잠시만 기다려 주세요.'); if(m!==null) db.ref('system').update({shutdown:true,msg:m.trim()}); };
$('a-off').onclick=()=>db.ref('system').update({shutdown:false});
$('a-reset').onclick=()=>{
  if(!shut) return toast('먼저 "셧다운 시작"을 눌러 주세요.');
  if(!confirm('주가와 모든 플레이어 기록이 삭제되고 새 시즌이 시작됩니다. 진행할까요?')) return;
  Promise.all([db.ref('market').remove(),db.ref('players').remove(),db.ref('system/season').transaction(n=>(n||0)+1)])
    .then(()=>toast('초기화 완료! 이제 "셧다운 해제"를 누르세요.')).catch(e=>toast('실패: '+e.message));
};

/* ---------- 알바 미니게임 ---------- */
let jtimer=null;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const jobLeft=()=>Math.max(0,Math.ceil(((me&&me.jobAt||0)+JOB_COOLDOWN_MS-Date.now())/1000));
function jobCool(){ const l=jobLeft(); $('jcool').textContent=l?`쉬는 중… ${l}초 뒤에 다시 일할 수 있어요`:'지금 일할 수 있어요!'; document.querySelectorAll('.job').forEach(b=>b.disabled=l>0); }
function jobMenu(){ clearInterval(jtimer); $('jgame').classList.add('hidden'); $('jmenu').classList.remove('hidden'); jobCool(); }
setInterval(()=>{ if(me&&!$('jmodal').classList.contains('hidden')) jobCool(); },500);
$('jbtn').onclick=()=>{ $('jmodal').classList.remove('hidden'); jobMenu(); };
$('jclose').onclick=()=>{ clearInterval(jtimer); $('jmodal').classList.add('hidden'); };
document.querySelectorAll('.job').forEach(b=>b.onclick=()=>{
  if(jobLeft()>0) return;
  $('jmenu').classList.add('hidden'); const g=$('jgame'); g.classList.remove('hidden'); g.innerHTML='';
  (b.dataset.j==='box'?gameBox:gameCalc)(g);
});
function jobDone(name,pay,g){
  me.cash+=pay; me.jobAt=Date.now(); addLog('알바',name,0,pay);
  localStorage.setItem(pk(),JSON.stringify(me)); lastPush=0; update();
  g.innerHTML=`<div class="jt">알바 끝! 🎉</div><div class="jc">+${won(pay)}원</div><button class="jbig" id="jback">돌아가기</button>`;
  $('jback').onclick=jobMenu;
}
function gameBox(g){
  g.innerHTML='<div class="jt">버튼을 누르면 시작! 최대한 많이 쌓으세요</div><div class="jc">0개</div><button class="jbig">📦 쌓기!</button>';
  const T=g.querySelector('.jt'),C=g.querySelector('.jc'),B=g.querySelector('.jbig'); let n=0,t=JOB_BOX_SEC,run=false;
  B.onclick=()=>{
    n++; C.textContent=n+'개';
    if(run) return; run=true;
    jtimer=setInterval(()=>{
      t-=0.1; T.textContent='남은 시간 '+Math.max(0,t).toFixed(1)+'초';
      if(t<=0){ clearInterval(jtimer); B.disabled=true; jobDone('택배 상하차',Math.min(n,JOB_BOX_MAX)*JOB_BOX_PAY,g); }
    },100);
  };
}
function gameCalc(g){
  g.innerHTML='<div class="jt"></div><div class="jq"></div><input class="ja" type="number" inputmode="numeric" aria-label="정답"><button class="jbig">확인</button><div class="jc">정답 0개</div>';
  const T=g.querySelector('.jt'),Q=g.querySelector('.jq'),A=g.querySelector('.ja'),B=g.querySelector('.jbig'),C=g.querySelector('.jc');
  let ok=0,t=JOB_CALC_SEC,ans=0;
  const next=()=>{ let a=rnd(10,60),b=rnd(5,40); const op=Math.random()<.5?'+':'−'; if(op==='−'&&b>a)[a,b]=[b,a]; ans=op==='+'?a+b:a-b; Q.textContent=`${a} ${op} ${b} = ?`; A.value=''; A.focus(); };
  const submit=()=>{ if(A.disabled) return; if(A.value!==''&&+A.value===ans){ ok++; C.textContent='정답 '+ok+'개'; } else C.textContent='틀렸어요! (정답 '+ok+'개)'; next(); };
  A.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); }); B.onclick=submit;
  next();
  jtimer=setInterval(()=>{
    t-=0.1; T.textContent='남은 시간 '+Math.max(0,t).toFixed(1)+'초';
    if(t<=0){ clearInterval(jtimer); A.disabled=true; B.disabled=true; jobDone('편의점 계산',ok*JOB_CALC_PAY,g); }
  },100);
}

/* ---------- 음악: 내장 BGM + 유튜브 곡 선택 ---------- */
const CHORDS=[[48,55,59,64],[45,52,55,60],[50,57,60,65],[43,50,53,59]];
const ARP=[0,1,2,3,2,1,3,2];
let ac=null,master=null,bgmTimer=null,nextT=0,stepN=0;
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(m,t,dur,type,vol){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=hz(m);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}
function sched(){
  while(nextT<ac.currentTime+1.2){
    const i=stepN%8, ch=CHORDS[Math.floor(stepN/8)%4];
    if(i===0) ch.forEach(m=>tone(m,nextT,3.2,'sine',0.12));
    tone(ch[ARP[i]]+12,nextT,0.5,'triangle',0.1);
    if(i%4===0) tone(ch[0]-12,nextT,0.35,'sine',0.2);
    nextT+=0.375; stepN++;
  }
}
function startSynth(){
  try{
    if(!ac){ ac=new(window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.connect(ac.destination); }
    master.gain.value=$('vol').value/100;
    ac.resume(); nextT=ac.currentTime+0.1;
    if(!bgmTimer) bgmTimer=setInterval(sched,200);
  }catch(e){ console.error(e); }
}
function stopSynth(){ clearInterval(bgmTimer); bgmTimer=null; if(ac) ac.suspend(); }

const ytId=u=>{const m=String(u).match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/);const t=String(u).trim();return m?m[1]:(/^[\w-]{11}$/.test(t)?t:null);};
const BUILTIN={t:'내장 BGM (잔잔한 루프)',id:'builtin'};
let custom=[]; try{ custom=JSON.parse(localStorage.getItem('stock_music')||'[]'); }catch(e){}
const baseTracks=MUSIC_LIST.map(x=>({t:x.t,id:ytId(x.u)})).filter(x=>x.id).concat([BUILTIN]);
const allTracks=()=>baseTracks.concat(custom);
let cur=localStorage.getItem('stock_track')||baseTracks[0].id, playing=false;
if(!allTracks().some(x=>x.id===cur)) cur=baseTracks[0].id;
$('mrep').checked = localStorage.getItem('stock_rep')!=='0';

let yt=null,ytReady=false,pendingId=null;
function ytLoad(id){
  pendingId=id; $('mmsg').textContent='';
  if(yt){ if(ytReady) yt.loadVideoById(id); return; }
  const mk=()=>{ yt=new YT.Player('ytplayer',{width:'256',height:'200',playerVars:{playsinline:1},events:{
    onReady:e=>{ ytReady=true; e.target.setVolume(+$('vol').value); e.target.loadVideoById(pendingId); },
    onStateChange:e=>{ if(e.data===0) nextTrack(true); },
    onError:()=>{ $('mmsg').textContent='이 영상은 재생할 수 없어요. 다른 곡을 골라 주세요.'; }
  }}); };
  if(window.YT&&YT.Player) mk();
  else{ window.onYouTubeIframeAPIReady=mk; const sc=document.createElement('script'); sc.src='https://www.youtube.com/iframe_api'; document.head.appendChild(sc); }
}
function playTrack(id){
  cur=id; playing=true; localStorage.setItem('stock_track',id); localStorage.setItem('stock_bgm','on');
  $('bgm').textContent='🔊';
  if(id==='builtin'){ if(yt&&ytReady) yt.pauseVideo(); $('ytbox').classList.add('hidden'); startSynth(); }
  else{ stopSynth(); $('ytbox').classList.remove('hidden'); ytLoad(id); }
  renderMusic();
}
function pauseAll(){ playing=false; stopSynth(); if(yt&&ytReady) yt.pauseVideo(); $('bgm').textContent='🔇'; localStorage.setItem('stock_bgm','off'); }
function nextTrack(auto){
  if(auto&&$('mrep').checked&&cur!=='builtin'&&yt&&ytReady){ yt.seekTo(0); yt.playVideo(); return; }
  const a=allTracks(), i=a.findIndex(x=>x.id===cur);
  playTrack(a[(i+1)%a.length].id);
}
function renderMusic(){
  const box=$('mlist'); box.innerHTML='';
  allTracks().forEach(t=>{
    const row=document.createElement('div'); row.className='it'+(t.id===cur&&playing?' on':'');
    const b=document.createElement('button'); b.className='pick'; b.textContent=(t.id===cur&&playing?'▶ ':'')+t.t; b.onclick=()=>playTrack(t.id);
    row.appendChild(b);
    if(custom.some(c=>c.id===t.id)){
      const d=document.createElement('button'); d.className='del'; d.textContent='✕'; d.title='삭제'; d.setAttribute('aria-label','삭제');
      d.onclick=()=>{ custom=custom.filter(c=>c.id!==t.id); localStorage.setItem('stock_music',JSON.stringify(custom)); if(cur===t.id) playTrack(baseTracks[0].id); else renderMusic(); };
      row.appendChild(d);
    }
    box.appendChild(row);
  });
}
async function addMusic(){
  const id=ytId($('murl').value), msg=$('mmsg');
  if(!id){ msg.textContent='유튜브 주소를 확인해 주세요.'; return; }
  if(allTracks().some(x=>x.id===id)){ msg.textContent='이미 목록에 있는 곡이에요.'; return; }
  let title=null;
  try{ const r=await fetch('https://www.youtube.com/oembed?url='+encodeURIComponent('https://youtu.be/'+id)+'&format=json'); title=(await r.json()).title; }catch(e){}
  custom.push({t:title||('내 음악 '+(custom.length+1)),id});
  localStorage.setItem('stock_music',JSON.stringify(custom));
  $('murl').value=''; msg.textContent='';
  playTrack(id);
}
function initBgm(){ if(localStorage.getItem('stock_bgm')!=='off') playTrack(cur); else{ $('bgm').textContent='🔇'; renderMusic(); } }
$('bgm').onclick=()=>{ if(playing) pauseAll(); else playTrack(cur); renderMusic(); };
$('mbtn').onclick=()=>$('mpanel').classList.toggle('hidden');
$('madd').onclick=addMusic;
$('murl').addEventListener('keydown',e=>{ if(e.key==='Enter') addMusic(); });
$('mrep').onchange=e=>localStorage.setItem('stock_rep',e.target.checked?'1':'0');
$('vol').value=localStorage.getItem('stock_vol')||35;
$('vol').oninput=e=>{ localStorage.setItem('stock_vol',e.target.value); if(master) master.gain.value=e.target.value/100; if(yt&&ytReady) yt.setVolume(+e.target.value); };
renderMusic();
</script>
